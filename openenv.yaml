spec_version: 1
name: finance_optimizer
type: space
runtime: fastapi
app: server.app:app
port: 8000
tasks:
  - id: ledger_cleanup
    name: Ledger Cleanup
    difficulty: easy
    description: "Correctly categorize 50 raw transactions."
    grader: server.grader:grade
    aliases:
      - task_easy
      - categorize_transactions
  - id: subscription_audit
    name: Subscription Audit
    difficulty: medium
    description: "Identify and cancel duplicate or unused subscriptions."
    grader: server.grader:grade
    aliases:
      - task_medium
      - cancel_subscriptions
  - id: cash_flow
    name: Cash Flow Management
    difficulty: hard
    description: "Prevent overdraft by transferring funds before a large payment."
    grader: server.grader:grade
    aliases:
      - task_hard
      - prevent_overdraft

