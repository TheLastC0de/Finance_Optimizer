spec_version: 1
name: finance_optimizer
type: space
runtime: fastapi
app: server.app:app
port: 8000
version: "1.0.0"
description: >
  Personal Finance & Subscription Optimizer environment.
  Helps users categorize bank ledgers, audit subscriptions, and manage cash flow.
author: "Rohan Pendharkar"
tags:
  - openenv
  - finance
  - advisor
  - management
license: "MIT"
endpoints:
  - /reset
  - /step
  - /state
  - /tasks
  - /grader
  - /baseline
  - /health
  - /schema
  - /ws
tasks:
  - id: ledger_cleanup
    difficulty: easy
    description: "Correctly categorize 50 raw transactions."
    max_steps: 100
    score_range: [0.0, 1.0]
    grader: graders.ledger_grader:LedgerGrader
    aliases:
      - task_easy
      - categorize_transactions
  - id: subscription_audit
    difficulty: medium
    description: "Identify and cancel duplicate or unused subscriptions."
    max_steps: 100
    score_range: [0.0, 1.0]
    grader: graders.subscription_grader:SubscriptionGrader
    aliases:
      - task_medium
      - cancel_subscriptions
  - id: cash_flow
    difficulty: hard
    description: "Prevent overdraft by transferring funds before a large payment."
    max_steps: 100
    score_range: [0.0, 1.0]
    grader: graders.cash_flow_grader:CashFlowGrader
    aliases:
      - task_hard
      - prevent_overdraft
observation_space:
  type: structured
  fields:
    - name: ledger
      type: list[dict]
      description: Transactions in the ledger
    - name: subscriptions
      type: list[dict]
      description: Subscriptions the user has
    - name: checking_balance
      type: float
      description: Checking balance
    - name: savings_balance
      type: float
      description: Savings balance
    - name: metadata
      type: dict
      description: Metadata about tasks
    - name: done
      type: bool
      description: Done
    - name: reward
      type: float
      description: Reward
action_space:
  type: structured
  fields:
    - name: action_type
      type: str
      description: The action type
    - name: tx_id
      type: str
      description: Transaction ID
    - name: category
      type: str
      description: Category
    - name: vendor_name
      type: str
      description: Vendor name
    - name: from_account
      type: str
      description: From account
    - name: to_account
      type: str
      description: To account
    - name: amount
      type: float
      description: Amount
    - name: text
      type: str
      description: Text
