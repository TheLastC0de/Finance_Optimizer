[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-finance-optimizer"
version = "1.0.0"
description = "Personal Finance & Subscription Optimizer environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.3",
    "fastapi>=0.110.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["models", "client", "inference"]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]